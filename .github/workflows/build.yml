name: build

on:
  push:
    branches:
      - 'master'
  pull_request:

jobs:
  build:
    name: build
    
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: compile
        run: ./.nuke/build.cmd
